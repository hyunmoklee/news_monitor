# filter_config_sk_hynix.yaml
# SK하이닉스 뉴스 기사 전처리 파이프라인 설정 파일

# 1. 타깃 기업 및 도메인 설정
pipeline:
  target_company: "SK하이닉스"
  aliases: 
    - "하이닉스"
    - "에스케이하이닉스"
    - "SK hynix"
    - "SK Hynix"
    - "SK하이닉스(주)"
  related_executives: 
    - "곽노정"
    - "최태원"
    - "박정호"
    - "안현"
    - "김주선"
  industry_keywords:
    - "반도체"
    - "HBM"
    - "HBM3E"
    - "HBM4"
    - "D램"
    - "DRAM"
    - "NAND"
    - "낸드"
    - "엔비디아"
    - "AI 반도체"
    - "웨이퍼"
    - "용인 클러스터"
    - "청주"
    - "이천"
    - "패키징"
    - "메모리"
    - "TSV"
    - "CXL"

# 2. 1차 규칙 기반 필터링 (품질 및 관련성 기준)
rule_filter:
  min_body_length: 250                # 공백 제외 최소 글자 수
  min_company_mentions: 2             # 본문 내 기업명 최소 출현 횟수
  
  # 스팸/리딩방 블랙리스트 키워드
  spam_keywords:
    - "무료 리딩방"
    - "급등주 포착"
    - "상한가 종목"
    - "카톡방 입장"
    - "추천주 공개"
    - "원금회복"
    - "목표가 달성"
  
  # 단순 시황 / 모음집 / 브리핑 탈락 패턴
  junk_title_patterns:
    - "이 시각 헤드라인"
    - "마감시황"
    - "장중시황"
    - "오후장 체크포인트"
    - "증시브리핑"
    - "코스피 마감"
    - "코스닥 마감"
    - "순매수 상위"
    - "장 마감 기준"
    - "브리핑 모음"
    - "게시판"
    - "증시키워드"
    - "외국인 3조"
    - "개인 순매수"
    - "비즈&"
    - "향후 방향성"
    - "재돌파"

  # 단순 시세/테마주 동향 패턴
  stock_price_theme_patterns:
    - '\d+만원대\s*회복'
    - '주가\s*장중\s*(?:상승|하락|기류)'
    - '약보합'
    - '강보합'
    - '테마가\s*\d+일'
    - '테마\s*엇갈린'
    - '포트폴리오\s*결실'
    - '순매수\s*상위'
    - '순매수\s*집중'
    - '차익\s*실현\s*매물'
    - '목표가\s*달성'

  # 타사 단독 이슈 배제용 국내 주요 대기업 리스트 (SK하이닉스 제외)
  other_major_companies:
    - "두산에너빌리티"
    - "삼성전자"
    - "LG에너지솔루션"
    - "현대차"
    - "기아"
    - "POSCO홀딩스"
    - "포스코"
    - "NAVER"
    - "카카오"
    - "KB금융"
    - "신한지주"
    - "삼성바이오로직스"
    - "셀트리온"
    - "한화에어로스페이스"
    - "HD현대중공업"
    - "한화오션"
    - "알테오젠"
    - "제주반도체"
    - "한국전력"
    - "LG전자"
    - "현대모비스"

# 3. 중복 판별 파라미터 (임베딩 및 클러스터링)
embedding_dedup:
  time_window_hours: 72               # 동일 사건 시간 윈도우 (시간)
  body_similarity_threshold: 0.25     # 본문 TF-IDF 코사인 유사도
  title_jaccard_threshold: 0.30       # 제목 키워드 자카드 유사도
  min_jaccard_candidate: 0.04         # 1차 후보군 압축

# 4. Master 기사 가치 점수화 (품질 및 언론사 신뢰도)
value_scoring:
  tier1_media_bonus: 25               # 1군 공신력 언론사 가산점
  naver_inlink_bonus: 15              # 네이버 뉴스 공식 인링크 가산점
  disclosure_score: 15                # DART/공시/IR 인용 가산점
  lead_mention_score: 15              # 첫 문장 내 타깃 기업 등장 가산점
  metric_score: 5                     # 수치/금액 표기 (최대 15점)
  quote_score: 5                      # 직접 인용문 (최대 15점)
  noise_penalty: -30                  # 웹 노이즈/깨진 텍스트 페널티

# 1군 공신력 언론사 목록
